
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aura AI - Assistente Pessoal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
            }
          }
        }
      }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
      
      /* Animation classes */
      .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
      .scale-up { animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }

      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .dark .glass {
        background: rgba(15, 23, 42, 0.7);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.1?conditions=es2015",

    "@google/genai": "https://esm.sh/@google/genai@^0.1.3?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@19.0.0?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@19.0.0?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@19.0.0?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@19.0.0?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@19.0.0?external=rxjs"
  }
}
</script>
</head>
